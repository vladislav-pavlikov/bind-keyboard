image: node:22

stages:
  - test
  - deploy
  - publish

# The project standardizes on Bun for installs and the test runner
# (bunfig.toml, bun.lockb) — `bun install` is what CONTRIBUTING and the
# pre-commit hook both use, so CI installs the same way instead of drifting
# from a separate package-lock.json.
before_script:
  - curl -fsSL https://bun.sh/install | bash -s "bun-v1.2.18"
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun install --frozen-lockfile

test:
  stage: test
  script:
    - npm run lint
    - npx tsc --noEmit
    - bun test --coverage
    - npm run build
    - npm run bundlesize
    - npm run check-exports
    - npm run check-dist-behavior
    - npm run demo:build
  # Feeds the README's coverage badge (GitLab renders it from this job's own
  # trace, no external service or artifact upload needed) — matches bun's
  # own coverage table, e.g. "All files | 100.00 | 100.00 |", capturing the
  # second (% Lines) column. Verified directly against real `bun test
  # --coverage` output before wiring this in.
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'

# GitLab Pages requires a job literally named "pages" that publishes a
# `public/` artifact — this is the live demo linked from the README, and,
# as of "pages:build" (see package.json), also badge-size.json (see
# scripts/write-size-badge.mjs) — the README's "gzip size" badge is a
# shields.io endpoint badge (https://img.shields.io/endpoint?url=…)
# pointed at that file once published here, so the badge always reflects
# whatever main's own build actually produces, no third-party bundle
# analysis service involved.
pages:
  stage: deploy
  script:
    - npm run pages:build
  artifacts:
    paths:
      - public
  only:
    - main

publish_npm:
  stage: publish
  when: manual
  script:
    - npm publish
  only:
    - main
